[package]
name = "runquiry-app"
description = "Runquiry 桌面应用装配与入口"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "runquiry"
path = "src/main.rs"

# 说明：git 依赖在此处内联而非经 workspace 继承，因为 cargo-deny 0.20 的
# bans 检查无法解析 git 源的 workspace 继承依赖（unresolved-workspace-dependency）。
# 提交/版本必须与根 Cargo.toml [workspace.dependencies] 保持一致。
[dependencies]
runquiry-core.workspace = true
runquiry-platform.workspace = true
runquiry-ui.workspace = true
# B4 依赖申请（经依赖守门人批准）：设置持久化需要 serde；
# serde 1.0.229 / serde_json 1.0.151 已在 Cargo.lock（GPUI 传递依赖），无新增包。
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_platform = { version = "0.1.0", git = "https://github.com/zed-industries/zed" }
gpui-component = { version = "0.5.2", git = "https://github.com/longbridge/gpui-component", rev = "91217366a5765600a127bf108ce00b7143a93381" }
gpui-component-assets = { version = "0.5.1", git = "https://github.com/longbridge/gpui-component", rev = "91217366a5765600a127bf108ce00b7143a93381" }

[lints]
workspace = true