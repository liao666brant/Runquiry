[package]
name = "runquiry-app"
description = "Runquiry 桌面应用装配与入口"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "runquiry"
path = "src/main.rs"

[dependencies]
runquiry-core.workspace = true
runquiry-platform.workspace = true
runquiry-ui.workspace = true
# B4 依赖申请（经依赖守门人批准）：设置持久化需要 serde；
# serde 1.0.229 / serde_json 1.0.151 已在 Cargo.lock（GPUI 传递依赖），无新增包。
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
gpui-kit.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[build-dependencies]
embed-resource = "=3.0.11"

[package.metadata.bundle]
name = "Runquiry"
identifier = "io.github.runquiry"
icon = ["../../assets/icons/runquiry-512.png"]
category = "Developer Tool"
linux_startup_wm_class = "runquiry"
short_description = "Local process investigation"

[lints]
workspace = true
