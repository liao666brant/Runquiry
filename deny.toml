# cargo-deny 配置。完整检查命令：cargo deny check
# 所有验证均须在 Cargo.lock（--locked）下进行。

[advisories]
version = 2
yanked = "deny"
# unmaintained 置为 none：当前锁定的 GPUI 依赖链带入了
# instant、paste、rustybuzz 等上游 unmaintained 传递依赖，本任务不得顺带
# 升级依赖；该信号改由公开发布前对最终 Cargo.lock 的人工复核覆盖
# （见总计划“许可证决策”）。
unmaintained = "none"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    # GPUI 依赖树中的常见宽松许可证，逐项对照上游 manifest 确认。
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    "bzip2-1.0.6",
]

# Runquiry 四个 crate 自身按总计划采用 GPL-3.0-or-later 分发。
[[licenses.exceptions]]
allow = ["GPL-3.0-or-later"]
name = "runquiry-app"

[[licenses.exceptions]]
allow = ["GPL-3.0-or-later"]
name = "runquiry-core"

[[licenses.exceptions]]
allow = ["GPL-3.0-or-later"]
name = "runquiry-platform"

[[licenses.exceptions]]
allow = ["GPL-3.0-or-later"]
name = "runquiry-ui"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
