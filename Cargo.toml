[workspace]
resolver = "3"
members = [
    "crates/runquiry-core",
    "crates/runquiry-platform",
    "crates/runquiry-ui",
    "crates/runquiry-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
runquiry-core = { path = "crates/runquiry-core", version = "0.1.0" }
runquiry-platform = { path = "crates/runquiry-platform", version = "0.1.0" }
runquiry-ui = { path = "crates/runquiry-ui", version = "0.1.0" }
# 注意：gpui/gpui-component 的 git 依赖由 runquiry-app 与 runquiry-ui 各自内联声明
# （与固定提交一致；cargo-deny 0.20 的 bans 检查无法解析 git 源的 workspace 继承
# 依赖）。两处 manifest 的 version/rev 必须保持同步，修改时须同时更新。
# Zed GPUI 的精确提交由 Cargo.lock 锁定
# （f66ed399cdde86092af8af3dc7b418abf45f37f8，与 gpui-component 固定提交
# 自带锁文件一致），所有验证必须使用 --locked，且不得运行无差别
# cargo update，否则 GPUI 会漂移到 zed main 分支新提交。

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
elided_lifetimes_in_paths = "warn"
non_ascii_idents = "deny"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = { level = "allow" }
must_use_candidate = { level = "allow" }
missing_errors_doc = { level = "allow" }
missing_panics_doc = { level = "allow" }