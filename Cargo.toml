[workspace]
resolver = "3"
members = [
    "crates/runquiry-core",
    "crates/runquiry-platform",
    "crates/runquiry-ui",
    "crates/runquiry-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
runquiry-core = { path = "crates/runquiry-core", version = "0.1.0" }
runquiry-platform = { path = "crates/runquiry-platform", version = "0.1.0" }
runquiry-ui = { path = "crates/runquiry-ui", version = "0.1.0" }
# GPUI Kit 统一提供 GPUI、组件与资源；传递依赖由 Cargo.lock 锁定。
# 所有验证必须使用 --locked，不运行无差别 cargo update。
gpui-kit = "=0.6.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
elided_lifetimes_in_paths = "warn"
non_ascii_idents = "deny"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = { level = "allow" }
must_use_candidate = { level = "allow" }
missing_errors_doc = { level = "allow" }
missing_panics_doc = { level = "allow" }
